<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Now Playing">
<title>Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Creepster&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0610;--gold:#ffcf5a;--ink:#fff4e0;--red:#e0262f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0610;--gold:#ffcf5a;--ink:#fff4e0}}
:root[data-theme="dark"]{--bg:#0b0610;--gold:#ffcf5a;--ink:#fff4e0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Bungee",Impact,"Arial Black",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at 50% 0%,#2a0f3d 0%,var(--bg) 70%)}
.screen{height:100%;display:flex;flex-direction:column}
.bulbs{position:relative;height:22px;flex:none}
.bulbs::before,.bulbs::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--gold) 0 5px,transparent 7px) 0 50%/40px 22px repeat-x;filter:drop-shadow(0 0 6px var(--gold));animation:blink 1.2s steps(1) infinite}
.bulbs::after{background-position:20px 50%;animation-delay:-.6s}
@keyframes blink{0%{opacity:1}50%{opacity:.2}}
header{flex:none;text-align:center;padding:1.2vh 2vw 0}
h1{margin:0;font-weight:400;font-size:clamp(34px,6vw,84px);letter-spacing:.12em;color:var(--gold);text-shadow:0 0 12px #ff9a1f,0 0 40px #c2410c}
.sub{font-family:"Creepster",cursive,Impact,sans-serif;font-size:clamp(18px,2.4vw,32px);color:#ff8a3d;letter-spacing:.2em}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.6vh 1.6vw;padding:2vh 2.4vw}
.card{position:relative;height:100%;aspect-ratio:2/3;justify-self:center;min-height:0;border-radius:8px;overflow:hidden;border:3px solid rgba(255,255,255,.15);opacity:.5;transform:scale(.96);transition:all .6s ease;cursor:pointer;background:#000}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.on{opacity:1;transform:scale(1.05);border-color:var(--gold);box-shadow:0 0 0 2px #000,0 0 34px 6px rgba(255,207,90,.55);z-index:2}
.badge{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;font-size:clamp(9px,1.1vw,15px);padding:.35em .9em;border-radius:99px;background:rgba(0,0,0,.7);color:#d8cdea;letter-spacing:.1em}
.on .badge{background:var(--red);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 18px 4px rgba(224,38,47,.8)}}
.ticker{flex:none;overflow:hidden;white-space:nowrap;background:#000;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:.9vh 0;color:var(--gold);font-size:clamp(14px,2vw,26px);letter-spacing:.12em}
.ticker span{display:inline-block;padding-left:100%;animation:scroll 40s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
#fs{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 30px);z-index:9;background:rgba(0,0,0,.6);color:var(--ink);border:1px solid var(--gold);border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
#detail{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2a0f3d 0%,#05020a 80%);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12vh + 12px)}
#detail[hidden]{display:none}
.poster{height:76vh;max-width:94vw;border-radius:8px;border:4px solid var(--gold);box-shadow:0 0 60px 8px rgba(255,207,90,.45);overflow:hidden;background:#000}
.poster img{width:100%;height:100%;display:block}
#back{position:absolute;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 16px);z-index:21;background:rgba(0,0,0,.45);color:var(--ink);border:1px solid rgba(255,207,90,.45);border-radius:999px;padding:.6em 1em;font:inherit;font-size:clamp(11px,1.5vh,14px);letter-spacing:.08em;cursor:pointer;opacity:.7}
#nowbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#000;border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}
#nowbar .row{display:flex;align-items:center;justify-content:center;gap:1.6vw;padding:.4vh 2vw 1.4vh;white-space:nowrap;overflow:hidden;color:var(--gold);letter-spacing:.08em;font-size:clamp(14px,min(3.4vh,5vw),38px);text-shadow:0 0 10px #ff9a1f}
#nowbar .live{color:#fff;background:var(--red);border-radius:99px;padding:.2em .8em;font-size:.7em;text-shadow:none;animation:pulse 1.4s ease-in-out infinite}
@media (max-aspect-ratio:1/1){.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}}
</style>
</head>

var names=["Beetlejuice","Practical Magic","Practical Magic 2","Halloweentown","Halloweentown II","Casper","The Addams Family","Monster House"];
var grid=document.getElementById("grid"),cur=0,timer;
names.forEach(function(t,n){
  var d=document.createElement("div");d.className="card";
  var im=document.createElement("img");im.src=IMGS[n].s;im.alt=t;
  var b=document.createElement("span");b.className="badge";
  d.appendChild(im);d.appendChild(b);
  d.onclick=function(){show(n);openFilm(n)};
  grid.appendChild(d);
});
function show(n){
  cur=n;
  [].forEach.call(grid.children,function(c,k){
    c.classList.toggle("on",k===n);
    c.querySelector(".badge").textContent=k===n?"● NOW PLAYING":(k===(n+1)%names.length?"UP NEXT":"COMING UP");
  });
}
function start(){clearInterval(timer);timer=setInterval(function(){show((cur+1)%names.length)},5000)}
var detail=document.getElementById("detail"),poster=document.getElementById("poster"),pimg=document.getElementById("pimg");
function openFilm(n){
  clearInterval(timer);
  pimg.src=IMGS[n].s;pimg.alt=names[n];document.getElementById("ntitle").textContent=names[n].toUpperCase();
  poster.style.aspectRatio=IMGS[n].w+"/"+IMGS[n].h;
  detail.hidden=false;fitNow();
}
function fitNow(){var r=document.querySelector("#nowbar .row");r.style.fontSize="";var s=parseFloat(getComputedStyle(r).fontSize);while(r.scrollWidth>r.clientWidth&&s>9){s-=1;r.style.fontSize=s+"px"}}
window.addEventListener("resize",function(){if(!detail.hidden)fitNow()});
function closeFilm(){detail.hidden=true;start()}
document.getElementById("back").onclick=closeFilm;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!detail.hidden)closeFilm()});
show(0);start();
var fs=document.getElementById("fs");
fs.onclick=function(){try{var e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}};
setTimeout(function(){fs.style.opacity=".35"},6000);
</script>
</body>
